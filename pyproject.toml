[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-py"
version = "0.11.0"
description = "Predictive Discovery Engine: autonomous modeling plus governed semantic data discovery and experimentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
# IMPLEMENTED: optional gradient-boosting estimators in the model registry.
boost = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2"]
# IMPLEMENTED: MLflow run logging for the champion (AutoMLConfig.enable_mlflow).
tracking = ["mlflow>=2.17"]
# EXPERIMENTAL: optional LLM hypothesis reasoner (AnthropicHypothesisReasoner); never required by the core.
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]
# REMOVED in 0.10: "explain" (shap) and "tuning" (optuna) extras were never consumed by the code.

[tool.setuptools.packages.find]
where = ["."]
include = ["automl_py*"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Pin the rule set explicitly so new ruff releases with different defaults
# cannot break CI. Import sorting, pyupgrade, comprehensions and ruff-specific
# checks are enforced; broad-exception rules (BLE, S) are intentionally not.
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "RUF"]
# The multiplication sign is used intentionally in human-readable join-key descriptions.
allowed-confusables = ["×"]
